<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ein paar Fragen für dich 💕</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<style>
:root{
  --bg1:#ffd1e3;--bg2:#ffb3d1;--card:#fff7fb;--ink:#7a1f4d;--soft:#b04a7c;
  --btn:#ff5fa2;--btn-ink:#fff;--no:#ffe0ee;--no-ink:#9c2f68;--shadow:rgba(214,51,132,.28);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#4a1030;--bg2:#6b1a45;--card:#3a0d27;--ink:#ffd9ea;--soft:#ffa8cd;
  --no:#5a1a3d;--no-ink:#ffc2de;--shadow:rgba(0,0,0,.4);}}
:root[data-theme="dark"]{--bg1:#4a1030;--bg2:#6b1a45;--card:#3a0d27;--ink:#ffd9ea;--soft:#ffa8cd;--no:#5a1a3d;--no-ink:#ffc2de;--shadow:rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:Quicksand,system-ui,sans-serif;font-weight:500;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.card{position:relative;width:100%;max-width:440px;background:var(--card);border-radius:32px;padding:22px 24px 30px;
  box-shadow:0 18px 50px var(--shadow);text-align:center}
.pic{display:block;height:190px;width:auto;max-width:100%;object-fit:contain;margin:0 auto}
.pic.bob{animation:bob .4s}
@keyframes bob{50%{transform:scale(1.08)}}
h1{font-family:Pacifico,cursive;font-weight:400;font-size:30px;margin:10px 0 6px;color:var(--btn)}
.sub{color:var(--soft);margin:0 0 18px;font-size:16px}
.bar{height:10px;background:var(--no);border-radius:99px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--btn);border-radius:99px;transition:width .4s}
.count{font-size:14px;color:var(--soft);margin:0 0 14px}
.q{font-size:24px;font-weight:700;line-height:1.3;margin:0 0 16px;min-height:80px;display:flex;align-items:center;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;min-height:64px}
button{max-width:100%;font:inherit;font-weight:700;font-size:20px;border:0;border-radius:99px;padding:14px 26px;cursor:pointer;
  transition:transform .15s,font-size .2s,padding .2s;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.yes,.next{background:var(--btn);color:var(--btn-ink);box-shadow:0 6px 16px var(--shadow)}
.no{background:var(--no);color:var(--no-ink)}
button:active{transform:scale(.94)}
button:disabled{cursor:default}
.react{font-size:19px;font-weight:700;color:var(--btn);margin:0 0 16px;min-height:58px;display:flex;align-items:center;justify-content:center;line-height:1.35}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hide{display:none!important}
.heart{position:fixed;top:-30px;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg);opacity:.85}}
.pop{position:fixed;pointer-events:none;z-index:50;font-size:26px;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}
.end .big{font-size:56px;margin:6px 0}
.back{position:absolute;top:14px;left:14px;z-index:2;width:42px;height:42px;padding:0;font-size:22px;line-height:1;background:var(--no);color:var(--no-ink)}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:60;width:46px;height:46px;padding:0;font-size:22px;background:var(--card);box-shadow:0 4px 12px var(--shadow)}
@media (prefers-reduced-motion:reduce){.heart,.pop{display:none}.shake,.pic.bob{animation:none}*{transition:none!important}}
#game{position:fixed;inset:0;z-index:40;background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
#gcv{width:100%;max-width:min(720px,calc((100vh - 200px) * 4 / 3));aspect-ratio:4/3;border-radius:20px;box-shadow:0 12px 30px var(--shadow);touch-action:none}
.ctl{display:flex;justify-content:space-between;width:100%;max-width:440px}
.ctl div{display:flex;gap:12px}
.ctl button{width:68px;height:68px;padding:0;font-size:28px;border-radius:50%;background:var(--btn);color:#fff;box-shadow:0 6px 16px var(--shadow);user-select:none;-webkit-user-select:none;touch-action:none}
.ghint{margin:0;color:var(--soft);font-size:13px}
#gwin{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
#gwin h2{font-family:Pacifico,cursive;font-weight:400;color:var(--btn);margin:6px 0}
#gwin p{margin:0 0 10px;color:var(--soft)}
@media (hover:none){.ghint{display:none}}
</style>
</head>
<body>
<button class="mute hide" id="mute" aria-label="Musik an/aus">🔊</button>
<main class="card" id="card">
  <button class="back hide" id="back" aria-label="Zurück zur letzten Frage">←</button>
  <img class="pic" id="pic" alt="">
  <h1 id="title">Hey!</h1>
  <p class="sub">Ein paar ganz wichtige Geburtstagsfragen 🎂</p>
  <div id="intro"><button class="yes" id="start">Los geht’s 💕</button></div>
  <div id="quiz" class="hide">
    <div class="bar"><i id="fill"></i></div>
    <p class="count" id="count"></p>
    <div id="stage">
      <p class="q" id="q"></p>
      <p class="react" id="react"></p>
      <div class="row" id="row">
        <button class="yes" id="yes">Ja</button>
        <button class="no" id="no">Nein</button>
        <button class="next hide" id="next">Weiter 💕</button>
      </div>
    </div>
  </div>
</main>
<div id="game" class="hide">
  <canvas id="gcv" width="800" height="600"></canvas>
  <div class="ctl">
    <div><button id="bl" aria-label="Links">◀</button><button id="br" aria-label="Rechts">▶</button></div>
    <div><button id="bj" aria-label="Springen">⤒</button><button id="bb" aria-label="Pusten">💨</button></div>
  </div>
  <p class="ghint">Pfeiltasten und Leertaste zum Laufen und Springen, E zum Pusten</p>
  <div id="gwin" class="hide">
    <img id="gwinpic" class="pic" alt="">
    <h2>Alle 30 Kerzen aus! 🎂</h2>
    <p>Jetzt darfst du dir was wünschen.</p>
    <div class="row"><button class="yes" id="again2">Nochmal 🎂</button><button class="no" id="close2">Fertig 💖</button></div>
  </div>
</div>

const $ = id => document.getElementById(id);
const yes=$("yes"), no=$("no"), next=$("next"), row=$("row"), card=$("card"), pic=$("pic");
const LIMIT = 5, reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const third = document.createElement("button"); third.className = "no hide"; third.textContent = "Nein";
row.insertBefore(third, next);
let waitTimer = 0;
let i=0, k=0, pushes=0, armed=false, turned=false, busy=false, vanish=false, ox=0, oy=0, flip=false, scale=1;
$("title").textContent = "Hey, " + NAME + "!";
function setPic(s){ pic.src = IMG[s]; pic.classList.remove("bob"); void pic.offsetWidth; pic.classList.add("bob"); }

// Musik (startet nach dem ersten Tippen, Browser erlauben kein Autoplay mit Ton)
const bgm = new Audio(MUSIC); bgm.loop = true; bgm.volume = .65;
const sfx = {
  jump: new Audio("JUMP.mp3"),
  puff: new Audio("PUST.mp3"),
  victory: new Audio("VICTORY.mp3"),
  doof: new Audio("DOOF.mp3")
};
for (const sound of Object.values(sfx)) sound.volume = .65;
function playSfx(name){
  const sound = sfx[name];
  if (!sound) return;
  sound.currentTime = 0;
  sound.play().catch(() => {});
}
const muteBtn = $("mute");
muteBtn.onclick = () => { bgm.muted = !bgm.muted; muteBtn.textContent = bgm.muted ? "🔇" : "🔊"; };
function startMusic(){ bgm.play().then(() => muteBtn.classList.remove("hide")).catch(() => {}); }

function burst(x, y){
  if (reduce) return;
  const em = ["💖","💕","✨","🌸","💗"];
  for (let n = 0; n < 14; n++){
    const s = document.createElement("span");
    s.className = "pop"; s.textContent = em[n % em.length];
    s.style.left = x + "px"; s.style.top = y + "px";
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.style.setProperty("--x", Math.cos(a) * d + "px");
    s.style.setProperty("--y", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
function rain(){
  if (reduce) return;
  for (let n = 0; n < 45; n++){
    const h = document.createElement("span");
    h.className = "heart"; h.textContent = ["💖","💕","🌸","💗"][n % 4];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 26 + "px";
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    h.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 8500);
  }
}
function say(t){
  $("react").textContent = t; setPic("bad");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
}
function reset(){
  const it = Q[i];
  no.style.cssText = ""; yes.style.cssText = "";
  yes.textContent = it.ja || "Ja"; no.textContent = it.nein || "Nein";
  yes.className = "yes"; no.className = "no";
  yes.disabled = no.disabled = false; third.classList.add("hide"); clearTimeout(waitTimer);
  if (it.mode === "wait"){ // beide Ja-Knöpfe sind gesperrt, nach 7 Sekunden erscheint "Nein"
    yes.disabled = no.disabled = true;
    waitTimer = setTimeout(() => third.classList.remove("hide"), 7000);
  }
  row.insertBefore(yes, next); row.insertBefore(no, next);
  next.classList.add("hide"); $("react").textContent = "";
  k=0; pushes=0; armed=false; turned=false; busy=false; vanish=false; ox=oy=0; flip=false; scale=1;
  setPic("std");
  if (it.finale){ // Nein-Knopf blendet in 10 Sekunden aus
    requestAnimationFrame(() => requestAnimationFrame(() => {
      no.style.transition = "opacity 10s linear"; no.style.opacity = "0";
    }));
    setTimeout(() => { if (Q[i].finale) no.style.pointerEvents = "none"; }, 10000);
  }
}
function show(){
  reset();
  $("q").textContent = Q[i].q;
  $("count").textContent = "Frage " + (i + 1) + " von " + Q.length;
  $("back").classList.toggle("hide", i === 0);
  $("fill").style.width = (i / Q.length * 100) + "%";
}
function done(t, ev){
  $("react").textContent = t; setPic("ok");
  yes.classList.add("hide"); no.classList.add("hide"); third.classList.add("hide"); next.classList.remove("hide");
  burst((ev && ev.clientX) || innerWidth / 2, (ev && ev.clientY) || innerHeight / 2);
  next.focus({preventScroll:true});
}
function finish(){
  $("fill").style.width = "100%"; setPic("ok");
  card.classList.add("end"); $("back").classList.add("hide");
  $("count").textContent = "Fertig! 🎉";
  $("stage").innerHTML = '<div class="big">💖</div><p class="q" style="min-height:0">' + END + '</p><div class="row"><button class="yes" id="bonus">Bonus-Level 🎂</button></div>';
  $("bonus").onclick = startGame;
  rain();
}
function growYes(big){
  scale = Math.min(scale + (big ? .6 : .15), big ? 4 : 2);
  yes.style.fontSize = 20 * scale + "px";
  yes.style.padding = 14 * scale + "px " + 26 * scale + "px";
}
function push(e){
  const it = Q[i];
  if (it.mode !== "repel" || !armed) return;
  if (vanish){ no.classList.add("hide"); say(it.gone); setPic("std"); return; }
  if (pushes >= LIMIT) return;
  pushes++;
  if (pushes === 1) $("react").textContent = it.push || "";
  if (pushes >= LIMIT){ ox = oy = 0; no.style.transform = ""; vanish = !!it.vanish; return; }
  const r = no.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = cx - e.clientX, dy = cy - e.clientY; const d = Math.hypot(dx, dy) || 1;
  dx = dx / d * 120; dy = dy / d * 120;
  const nl = Math.min(Math.max(r.left + dx, 8), innerWidth - r.width - 8);
  const nt = Math.min(Math.max(r.top + dy, 8), innerHeight - r.height - 8);
  ox += nl - r.left; oy += nt - r.top;
  no.style.transform = "translate(" + ox + "px," + oy + "px)";
}
function fadeOut(){ // Finale: bei Berührung schnell ausblenden
  if (!Q[i].finale) return;
  no.style.transition = "opacity .35s"; no.style.opacity = "0"; no.style.pointerEvents = "none";
}
function flipBoth(){
  if (Q[i].mode !== "hoverflip") return;
  yes.textContent = "Nein"; no.textContent = "Nein";
}
no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse"){ push(e); fadeOut(); flipBoth(); } });
no.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") push(e); fadeOut(); flipBoth(); });
no.addEventListener("focus", () => { fadeOut(); flipBoth(); });
yes.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") flipBoth(); });
yes.addEventListener("pointerdown", flipBoth);
yes.addEventListener("focus", flipBoth);

no.addEventListener("click", e => {
  const it = Q[i];
  if (busy) return;
  if (it.finale) return finish();
  if (turned) return done(it.fin || "Na also, war das so schwer? :)", e);
  if (it.mode === "both") return done(it.y2 || it.y, e);
  if (it.mode === "hoverflip") return done(it.y, e);
  if (it.mode === "repel"){
    if (!armed){ say(it.nos[0]); armed = true; return; }
    if (pushes < LIMIT) return;
    busy = true;
    yes.textContent = "Nein"; yes.className = "no";
    no.textContent = "Ja"; no.className = "yes";
    setTimeout(() => done(it.y, e), 700);
    return;
  }
  say(it.nos[k]);
  if (it.labels && it.labels[k]) no.textContent = it.labels[k];
  if (it.mode === "shrink"){ growYes(true); no.style.transform = "scale(" + Math.max(.4, 1 - .2 * (k + 1)) + ")"; }
  else if (it.grow) growYes();
  if (it.mode === "shuffle"){ flip = !flip; no.style.order = flip ? "-1" : "0"; }
  k++;
  if (k >= it.nos.length){
    if (it.mode === "shrink") no.classList.add("hide");
    else { turned = true; no.className = "yes"; no.style.transform = ""; no.textContent = it.turn || "Ja"; }
  }
});
yes.addEventListener("click", e => {
  if (busy) return;
  const it = Q[i];
  if (it.finale) return finish();
  done(it.y, e);
});
third.addEventListener("click", e => done(Q[i].y, e));
next.addEventListener("click", () => { i++; show(); });
$("back").addEventListener("click", () => { if (i > 0){ i--; show(); } });
// ===== Bonus-Level: Kerzen auspusten (5 Level à 6 Kerzen) =====
// Plattform: [x, y, Breite]  |  Kerze: [x, y der Fläche, auf der sie steht]
const LV = [
 {w:1100,p:[[0,250,420],[490,250,610],[250,190,90],[600,190,100],[800,170,90]],
  c:[[120,250],[290,190],[540,250],[640,190],[840,170],[1000,250]]},
 {w:1200,p:[[0,250,300],[370,250,200],[640,250,560],[180,180,80],[420,170,90],[700,190,90],[900,170,90]],
  c:[[60,250],[220,180],[460,170],[740,190],[940,170],[1120,250]]},
 {w:1300,p:[[0,250,250],[320,250,120],[510,250,120],[700,250,600],[150,190,70],[360,180,70],[550,180,70],[760,170,100],[960,200,90]],
  c:[[60,250],[185,190],[395,180],[585,180],[800,170],[1200,250]]},
 {w:1400,p:[[0,250,200],[270,250,100],[440,250,100],[610,250,100],[780,250,620],[100,180,60],[300,175,60],[470,175,60],[640,175,60],[900,190,100],[1100,170,90]],
  c:[[130,180],[330,175],[500,175],[670,175],[930,190],[1130,170]]},
 {w:1500,p:[[0,250,300],[370,250,150],[590,250,150],[810,250,690],[200,190,80],[430,170,80],[650,170,80],[900,180,90],[1100,170,90],[1290,170,100]],
  c:[[230,190],[460,170],[680,170],[930,180],[1130,170],[1330,170]]}
];
const gcv = $("gcv"), g = gcv.getContext("2d"), gi = {};
for (const s of ["std","run","ok","bad"]){ gi[s] = new Image(); gi[s].src = IMG[s === "std" ? "gstd" : s]; }
const CC = ["#ffe066","#9ad8ff","#c9a7ff","#ffb3d1","#a8f0c6"];
let gl=0, gp, gc=[], camX=0, total=0, running=false, gdone=false, banner=0, tick=0, picS="std", picT=0, puffs=[], last=0, acc=0;
const keys = {l:false, r:false, j:false};
function setP(s, ms){ picS = s; clearTimeout(picT); if (s !== "std") picT = setTimeout(() => picS = "std", ms); }
function spawn(){ gp = {x:40, y:200, vx:0, vy:0, on:false, dir:1}; camX = 0; }
function loadLevel(n){ gl = n; gc = LV[n].c.map((c, idx) => ({x:c[0], y:c[1], lit:true, s:0, col:CC[idx % 5]})); spawn(); }
function blow(){
  if (!running || gdone) return;
  playSfx("puff");
  let hit = false;
  for (const c of gc) if (c.lit && Math.abs(c.x - gp.x) < 38 && Math.abs(c.y - gp.y) < 50){ c.lit = false; c.s = 40; total++; hit = true; }
  puffs.push({x:gp.x + gp.dir * 20, y:gp.y - 38, t:18});
  if (hit) setP("ok", 600);
  if (gc.every(c => !c.lit)){
    gdone = true; banner = 90;
    playSfx("victory");
    setTimeout(() => { if (gl < LV.length - 1){ gdone = false; loadLevel(gl + 1); } else win(); }, 1500);
  }
}
function step(){
  tick++;
  if (gdone) return;
  const L = LV[gl], a = (keys.l ? -1 : 0) + (keys.r ? 1 : 0);
  gp.vx = a * 2.6; if (a) gp.dir = a;
  if (keys.j && gp.on){ gp.vy = -10; gp.on = false; playSfx("jump"); }
  gp.vy = Math.min(gp.vy + .5, 12);
  gp.x = Math.max(12, Math.min(L.w - 12, gp.x + gp.vx));
  const pb = gp.y; gp.y += gp.vy; gp.on = false;
  if (gp.vy >= 0) for (const q of L.p)
    if (gp.x > q[0] - 8 && gp.x < q[0] + q[2] + 8 && pb <= q[1] + 1 && gp.y >= q[1]){ gp.y = q[1]; gp.vy = 0; gp.on = true; break; }
  if (gp.y > 380){ playSfx("doof"); setP("bad", 800); spawn(); }
  camX = Math.max(0, Math.min(L.w - 400, gp.x - 160));
  puffs.forEach(p => p.t--); puffs = puffs.filter(p => p.t > 0);
}
function rr(x, y, w, h, r){
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill();
}
function hash(n){ return ((n * 2654435761) >>> 0) % 1000 / 1000; }
function hills(col, base, amp, f, par, ph){
  g.fillStyle = col; g.beginPath(); g.moveTo(0, 300);
  for (let x = 0; x <= 400; x += 8) g.lineTo(x, base + Math.sin((x + camX * par) * f + ph) * amp);
  g.lineTo(400, 300); g.closePath(); g.fill();
}
function heart(x, y, s){
  g.beginPath(); g.moveTo(x, y + s * .35);
  g.bezierCurveTo(x - s, y - s * .3, x - s * .5, y - s, x, y - s * .4);
  g.bezierCurveTo(x + s * .5, y - s, x + s, y - s * .3, x, y + s * .35); g.fill();
}
function cloud(x, y, s){ // Wolke mit Gesicht
  g.fillStyle = "rgba(255,255,255,.95)"; g.beginPath();
  g.arc(x, y, 12 * s, 0, 7); g.arc(x + 15 * s, y - 7 * s, 16 * s, 0, 7); g.arc(x + 32 * s, y, 12 * s, 0, 7); g.fill();
  rr(x - 12 * s, y - 2 * s, 56 * s, 14 * s, 7 * s);
  g.fillStyle = "#7a1f4d";
  g.beginPath(); g.arc(x + 11 * s, y + 1 * s, 1.5 * s, 0, 7); g.arc(x + 21 * s, y + 1 * s, 1.5 * s, 0, 7); g.fill();
  g.fillStyle = "rgba(255,143,191,.6)";
  g.beginPath(); g.arc(x + 6 * s, y + 5 * s, 2.8 * s, 0, 7); g.arc(x + 26 * s, y + 5 * s, 2.8 * s, 0, 7); g.fill();
  g.strokeStyle = "#7a1f4d"; g.lineWidth = 1 * s; g.beginPath(); g.arc(x + 16 * s, y + 3 * s, 3 * s, .2, Math.PI - .2); g.stroke();
}
function flower(x, y, c){
  g.fillStyle = "#7bd389"; g.fillRect(x - .4, y - 4, .8, 4);
  g.fillStyle = c;
  for (let a = 0; a < 5; a++){ g.beginPath(); g.arc(x + Math.cos(a * 1.2566) * 2.6, y - 6 + Math.sin(a * 1.2566) * 2.6, 1.9, 0, 7); g.fill(); }
  g.fillStyle = "#ffe066"; g.beginPath(); g.arc(x, y - 6, 1.5, 0, 7); g.fill();
}
const SPR = ["#ff6fa8","#6ec6ff","#ffd65c","#9be7b0","#c39bff"];
function block(x, y, w, thick, seed){ // Kuchen-Block mit Zuckerguss
  g.fillStyle = "#ff9ec6"; rr(x, y + 2, w, thick, 7);
  g.fillStyle = "rgba(255,255,255,.35)";
  for (let dx = 10; dx < w - 6; dx += 22) for (let dy = 20; dy < thick - 4; dy += 22){
    g.beginPath(); g.arc(x + dx + ((dy / 22 | 0) % 2) * 9, y + dy, 3, 0, 7); g.fill();
  }
  g.fillStyle = "#fff6fb"; rr(x - 2, y - 3, w + 4, 10, 5);
  for (let dx = 7; dx < w - 4; dx += 14){
    const len = 3 + hash(seed + dx) * 7;
    g.beginPath(); g.ellipse(x + dx, y + 6, 4.5, len / 2 + 2, 0, 0, 7); g.fill();
  }
  for (let dx = 8; dx < w - 6; dx += 13){
    g.fillStyle = SPR[(dx / 13 | 0) % 5]; g.fillRect(x + dx, y - 1 + hash(seed + dx * 3) * 3, 3, 1.4);
  }
}
function draw(){
  g.setTransform(2, 0, 0, 2, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, 300);
  gr.addColorStop(0, "#ffcfe6"); gr.addColorStop(.55, "#eedbff"); gr.addColorStop(1, "#fff0f7");
  g.fillStyle = gr; g.fillRect(0, 0, 400, 300);
  // Regenbogen
  const rx = 250 - camX * .08, RC = ["#ffb3c7","#ffd9a8","#fff3a8","#c4f0c9","#b7e0ff","#d9c4ff"];
  g.globalAlpha = .55; g.lineWidth = 7;
  RC.forEach((c, n) => { g.strokeStyle = c; g.beginPath(); g.arc(rx, 235, 150 - n * 7, Math.PI, 0); g.stroke(); });
  g.globalAlpha = 1;
  hills("#e3d4ff", 215, 14, .012, .12, 0);
  for (let n = 0; n < 7; n++) cloud(((n * 230 - camX * .4) % 1600 + 1600) % 1600 - 100, 36 + (n % 3) * 34 + Math.sin(tick * .02 + n) * 2, .85 + (n % 3) * .2);
  hills("#cdeede", 238, 10, .02, .25, 2);
  for (let n = 0; n < 18; n++){ // Funkeln und Herzchen
    const sx = ((hash(n + 1) * 900 - camX * .3) % 900 + 900) % 900 - 50, sy = 18 + hash(n + 50) * 170, tw = .5 + .5 * Math.sin(tick * .06 + n);
    g.globalAlpha = .3 + .55 * tw; g.fillStyle = n % 2 ? "#ffffff" : "#ff8fbf";
    if (n % 3 === 0) heart(sx, sy, 3 + tw * 2); else { g.font = "10px sans-serif"; g.textAlign = "center"; g.fillText("✦", sx, sy); }
  }
  g.globalAlpha = 1;
  LV[gl].p.forEach((q, n) => {
    const x = q[0] - camX; if (x > 410 || x + q[2] < -10) return;
    const ground = q[1] === 250;
    block(x, q[1], q[2], ground ? 70 : 14, n * 97);
    if (ground) for (let fx = 22, m = 0; fx < q[2] - 10; fx += 46 + hash(n * 31 + m) * 30, m++){
      if (m % 3 === 2){ g.fillStyle = "#ff6fa8"; heart(x + fx, q[1] - 5, 3); } else flower(x + fx, q[1] - 3, ["#ffffff","#ffc4dc","#d9c2ff"][m % 3]);
    }
  });
  g.textAlign = "center";
  for (const c of gc){
    const x = c.x - camX;
    g.fillStyle = c.col; rr(x - 5, c.y - 28, 10, 28, 4);
    g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(x - 5, c.y - 21, 10, 3); g.fillRect(x - 5, c.y - 8, 10, 3);
    g.fillStyle = "rgba(255,255,255,.7)"; g.fillRect(x - 3.5, c.y - 26, 1.5, 22);
    g.fillStyle = "#7a1f4d"; g.beginPath(); g.arc(x - 1.8, c.y - 15, .9, 0, 7); g.arc(x + 1.8, c.y - 15, .9, 0, 7); g.fill();
    g.strokeStyle = "#7a1f4d"; g.lineWidth = .7; g.beginPath(); g.arc(x, c.y - 13.5, 1.8, .3, Math.PI - .3); g.stroke();
    g.fillStyle = "#7a1f4d"; g.fillRect(x - .5, c.y - 33, 1, 5);
    if (c.lit){
      const near = Math.abs(c.x - gp.x) < 38 && Math.abs(c.y - gp.y) < 50, f = Math.sin(tick * .25 + c.x) * 1.2;
      g.fillStyle = "rgba(255,224,102,.25)"; g.beginPath(); g.arc(x, c.y - 40, near ? 18 : 12, 0, 7); g.fill();
      g.fillStyle = "#ff9f43"; g.beginPath(); g.ellipse(x + f * .5, c.y - 40, 4.5, 8 + f, 0, 0, 7); g.fill();
      g.fillStyle = "#ffe066"; g.beginPath(); g.ellipse(x + f * .5, c.y - 39, 2.2, 4.5, 0, 0, 7); g.fill();
      if (near){ g.font = "16px sans-serif"; g.fillText("💨", x, c.y - 58 + Math.sin(tick * .2) * 2); }
    } else if (c.s > 0){
      c.s--; g.fillStyle = "rgba(150,150,150," + (c.s / 60) + ")";
      g.beginPath(); g.arc(x + Math.sin(c.s * .3) * 3, c.y - 36 - (40 - c.s) * .6, 4 + (40 - c.s) * .1, 0, 7); g.fill();
    }
  }
  // Figur: steht = Standard, läuft/springt = Lauf-Bild, Pusten = RICHTIG, Fallen = FALSCH
  const moving = !gdone && (!gp.on || gp.vx !== 0);
  const key = picS === "ok" ? "ok" : picS === "bad" ? "bad" : (moving ? "run" : "std");
  const im = (gi[key].complete && gi[key].naturalWidth) ? gi[key] : gi.std;
  if (gp.on){ g.fillStyle = "rgba(122,31,77,.18)"; g.beginPath(); g.ellipse(gp.x - camX, gp.y, 13, 3, 0, 0, 7); g.fill(); }
  if (im.naturalWidth){
    const h = 60, w = h * im.naturalWidth / im.naturalHeight, b = (gp.on && gp.vx) ? Math.abs(Math.sin(tick * .3)) * 3 : 0;
    g.save(); g.translate(gp.x - camX, gp.y);
    if (key === "run" && gp.dir < 0) g.scale(-1, 1);
    g.rotate(key === "run" ? 0 : gp.vx * .03 + (gp.on ? 0 : gp.vy * .01));
    g.drawImage(im, -w / 2, -h - b, w, h); g.restore();
  }
  for (const p of puffs){
    g.fillStyle = "rgba(255,255,255," + (p.t / 18) + ")";
    g.beginPath(); g.arc(p.x - camX + gp.dir * (18 - p.t), p.y, 6 + (18 - p.t) * .8, 0, 7); g.fill();
  }
  g.fillStyle = "rgba(255,255,255,.75)"; rr(6, 5, 74, 21, 10.5); rr(308, 5, 86, 21, 10.5);
  g.fillStyle = "#7a1f4d"; g.font = "bold 13px Quicksand,sans-serif";
  g.textAlign = "left"; g.fillText("🕯️ " + total + "/30", 13, 20);
  g.textAlign = "right"; g.fillText("Level " + (gl + 1) + "/" + LV.length, 387, 20);
  g.textAlign = "center";
  if (tick < 300 && !gdone) g.fillText("Lauf zur Kerze und drück 💨", 200, 278);
  if (gdone){ g.font = "bold 22px Quicksand,sans-serif"; g.fillText(gl < LV.length - 1 ? "Level geschafft! 🎉" : "Alle Kerzen aus! 🎂", 200, 150); }
}
function loop(ts){
  if (!running) return;
  requestAnimationFrame(loop);
  acc += Math.min(ts - last, 100); last = ts;
  while (acc >= 16.67){ step(); acc -= 16.67; }
  draw();
}
function startGame(){
  if (document.activeElement) document.activeElement.blur();
  $("game").classList.remove("hide"); $("gwin").classList.add("hide");
  total = 0; gdone = false; tick = 0; puffs = []; picS = "std"; loadLevel(0);
  if (!running){ running = true; last = performance.now(); acc = 0; requestAnimationFrame(loop); }
}
function win(){ running = false; $("gwin").classList.remove("hide"); $("gwinpic").src = IMG.ok; rain(); }
$("again2").onclick = startGame;
$("close2").onclick = () => { running = false; $("game").classList.add("hide"); };
const KM = {ArrowLeft:"l", KeyA:"l", ArrowRight:"r", KeyD:"r", ArrowUp:"j", KeyW:"j", Space:"j"};
addEventListener("keydown", e => {
  if (!running) return;
  if (KM[e.code]){ keys[KM[e.code]] = true; e.preventDefault(); }
  if (["KeyE","Enter","KeyB","KeyP"].includes(e.code) && !e.repeat){ blow(); e.preventDefault(); }
});
addEventListener("keyup", e => { if (KM[e.code]) keys[KM[e.code]] = false; });
function bindKey(id, k){
  const b = $(id);
  b.addEventListener("pointerdown", e => { e.preventDefault(); keys[k] = true; });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
}
bindKey("bl", "l"); bindKey("br", "r"); bindKey("bj", "j");
$("bb").addEventListener("pointerdown", e => { e.preventDefault(); blow(); });

$("start").addEventListener("click", () => {
  startMusic();
  $("intro").classList.add("hide"); $("quiz").classList.remove("hide");
  show();
});
</script>
